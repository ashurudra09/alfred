[project]
name = "alfred"
version = "0.1.0"
description = "Offline laptop butler: a fine-tuned small model calling local tools"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
