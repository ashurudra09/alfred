[project]
name = "alfred"
version = "0.1.0"
description = "Offline laptop butler: a fine-tuned small model calling local tools"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "huggingface-hub>=2.2.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp<2",
    "openai>=3.36.1",
    "psutil>=7.2.2",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "send2trash>=2.1.0",
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "tokenizers>=0.23.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
alfred = "alfred.agent.cli:main"
alfred-ui = "alfred.ui.app:main"
