# SFT of Qwen3.5-2B on the Alfred dataset (Phase 5). Read by train/sft_kernel/sft.py on Kaggle.
model: unsloth/Qwen3.5-2B
load_in_4bit: false          # Unsloth advises 16-bit LoRA for Qwen3.5 (4-bit QLoRA loses more); ~5 GB VRAM for 2B
max_seq_length: 4096         # longest v3 example is 3,978 tokens
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  # Kaggle T4 (float32, one GPU): the 2026-10-22 probe said 33.5 s/step but the v1/v2 runs averaged 23 s/step. v3 is a
  # FULL epoch: 10,285 examples / batch 8 = 1,286 steps, ~8.5 h at ~24 s/step (examples are ~5% longer), plus evals and
  # export: ~10 h of the 12 h session. max_hours stops it before the session does and keeps the best checkpoint.
  epochs: 1
  max_steps: -1              # a full epoch; the cosine decay is computed over it
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  batch_size: 2
  grad_accum: 4              # effective batch 8
  weight_decay: 0.01
  seed: 3407
  eval_every: 215            # steps (6 evals); best checkpoint by val loss
  eval_subset: 60            # val examples per eval (~5 min each on a T4)
  max_hours: 10.5            # safety stop; keeps the best checkpoint and leaves ~1.5 h for export (12 h session)
probe_steps: 20              # PROBE=1: train this many steps, report seconds/step, skip export
export: [q4_k_m, q8_0]
